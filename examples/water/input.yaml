cutoff: 4.0
seed: 0
device: 'cuda'
Data:
  type: ase
  path: data 
  trainBatch: 16
  testBatch: 16
  trainSet: train.xyz
  testSet: test.xyz
  numWorkers: 16
Model:
  nLayer: 3
  activateFn: silu
  nEmbedding: 16
  nHidden: 16
  maxRWay: 2
  maxOutWay: 2
  CutoffLayer:
    type: poly
    p: 5
  RadialLayer:
    #type: bessel
    type: besselMLP
    nBasis: 16
    nHidden: [16, 16]
    activateFn: silu
Train:
  warmupSteps: 20
  allowMissing: False
  targetProp: ["dipole", "polarizability"] 
  weight: [1.0, 1.0]
  amsGrad: True                          # use amsGrad  
  maxEpoch: 100
  evalStepInterval: 1.0
  evalEpochInterval: 1
  emaDecay: 0.0                          # use ema
  Optimizer: 
    type: AdamW
    amsGrad: True
    weightDecay: !!float 0.
    learningRate: !!float 1e-3
  LrScheduler:
    type: reduceOnPlateau
    lrFactor: 0.8
    patience: 500    
